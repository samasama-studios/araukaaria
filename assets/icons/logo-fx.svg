<svg xmlns="http://www.w3.org/2000/svg" class="svg-defs" aria-hidden="true">
  <!-- Logo colour effect, applied by style.css as filter: url(#logo-fx).
       Offset red, green and blue copies sit behind the white logo, recreating
       the original colour logo. glitch.js loads this file into the page, then
       jitters the copies and the white logo during the entry, settling back on
       these values. Units are fractions of the logo size, so the offsets scale
       with it. -->
  <filter id="logo-fx" primitiveUnits="objectBoundingBox" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feFlood flood-color="#ff0000" flood-opacity="0.33" />
    <feComposite in2="SourceAlpha" operator="in" />
    <feOffset class="fx-fringe" dx="0.022" dy="-0.026" result="red" />
    <feFlood flood-color="#00ff00" flood-opacity="0.27" />
    <feComposite in2="SourceAlpha" operator="in" />
    <feOffset class="fx-fringe" dx="0.008" dy="0.009" result="green" />
    <feFlood flood-color="#2f6bff" flood-opacity="0.4" />
    <feComposite in2="SourceAlpha" operator="in" />
    <feOffset class="fx-fringe" dx="-0.008" dy="-0.006" result="blue" />
    <!-- Solid blue edge on the leaf only (this box excludes the ring). -->
    <feFlood flood-color="#2f6bff" x="0.25" y="0.16" width="0.51" height="0.68" />
    <feComposite in2="SourceAlpha" operator="in" x="0.25" y="0.16" width="0.51" height="0.68" />
    <feOffset class="fx-fringe" dx="-0.006" dy="0" result="blue-leaf" />

    <!-- The white logo itself (offset is 0 at rest). -->
    <feOffset class="fx-shift" in="SourceGraphic" dx="0" dy="0" result="logo" />

    <feMerge>
      <feMergeNode in="red" />
      <feMergeNode in="green" />
      <feMergeNode in="blue" />
      <feMergeNode in="blue-leaf" />
      <feMergeNode in="logo" />
    </feMerge>
  </filter>

  <!-- Same effect for the wordmark under the logo. The wordmark is long and
       thin, so the offsets are scaled to its letter height instead. -->
  <filter id="word-fx" primitiveUnits="objectBoundingBox" x="-20%" y="-60%" width="140%" height="220%" color-interpolation-filters="sRGB">
    <feFlood flood-color="#ff0000" flood-opacity="0.33" />
    <feComposite in2="SourceAlpha" operator="in" />
    <feOffset class="fx-fringe" dx="0.0086" dy="-0.11" result="red" />
    <feFlood flood-color="#00ff00" flood-opacity="0.27" />
    <feComposite in2="SourceAlpha" operator="in" />
    <feOffset class="fx-fringe" dx="0.0034" dy="0.045" result="green" />
    <feFlood flood-color="#2f6bff" flood-opacity="0.4" />
    <feComposite in2="SourceAlpha" operator="in" />
    <feOffset class="fx-fringe" dx="-0.0034" dy="-0.03" result="blue" />
    <!-- Solid blue edge, like the one on the leaf. -->
    <feFlood flood-color="#2f6bff" />
    <feComposite in2="SourceAlpha" operator="in" />
    <feOffset class="fx-fringe" dx="-0.0025" dy="0" result="blue-edge" />

    <feOffset class="fx-shift" in="SourceGraphic" dx="0" dy="0" result="word" />

    <feMerge>
      <feMergeNode in="red" />
      <feMergeNode in="green" />
      <feMergeNode in="blue" />
      <feMergeNode in="blue-edge" />
      <feMergeNode in="word" />
    </feMerge>
  </filter>
</svg>
